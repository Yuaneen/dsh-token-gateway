# dsh-ai-gateway-budget — one admission gate for every model call.
#
# Installed as a profile bundle: `dsh plugin --profile web add .` (or the GitHub spec)
# The row below is inserted into the profile's loader tree. Every key is
# validated at load time by src/config.js; a bad value fails the mount instead
# of silently disabling a budget.
- insert:
    - id: ai-gateway
      name: dsh-ai-gateway-budget
      config:
        # Budget caps in USD per scope. Omit a scope or set it to null for
        # unlimited. 0 is rejected: it is not a cap, it is a typo.
        budgets:
          session: 2
          daily: 10
          monthly: 100

        # alert  = notify only
        # block  = refuse new model calls until /gateway unblock <scope>
        # degrade = re-dispatch to the cheaper model in `degradation`
        overLimit: block

        # Only used by overLimit: degrade. Same provider, cheaper model.
        degradation:
          deepseek-v4-pro: deepseek-v4-flash

        # Start degrading at the warn ratio instead of only at the hard cap.
        degradeAt: warn

        warnRatio: 0.8

        # Display currency. Accounting stays USD.
        currency:
          code: CNY
          rate: 7.2
          decimals: 3

        pricing:
          # USD per 1M tokens, merged over the built-in snapshot.
          # Example: { "deepseek-v4-pro": { input: 1.25, output: 3.75 } }
          prices: {}
          # Off-peak is half price in the two Beijing working-hour windows.
          peak:
            enabled: true
            timeZone: Asia/Shanghai
            offPeakMultiplier: 0.5

        gateway:
          # Read-only control API at /ai-gateway/v1/status and /v1/usage.
          http: true
          basePath: /ai-gateway
          # Set a bearer token before exposing the web host beyond loopback.
          token: ''

        persistence:
          enabled: true
          file: $DSH_HOME/ai-gateway/ledger.json
          flushMs: 500
