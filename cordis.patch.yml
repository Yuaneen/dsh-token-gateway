# dsh-token-gateway — one admission gate for every model call.
#
# Installed as a profile bundle: `dsh plugin --profile web add .` (or the GitHub spec)
# The row below is inserted into the profile's loader tree. Every key is
# validated at load time by src/config.js; a bad value fails the mount instead
# of silently disabling a budget.
- insert:
    - id: token-gateway
      name: dsh-token-gateway
      config:
        # Budget caps in USD per scope. Omit a scope or set it to null for
        # unlimited. 0 is rejected: it is not a cap, it is a typo.
        budgets:
          session: 2
          daily: 10
          monthly: 100

        # Optional token caps, in total tokens (cached input included). A separate
        # dimension from the USD caps: a call is admitted only when every capped
        # scope passes in BOTH dimensions. null = no token cap.
        tokenBudgets:
          session: null
          daily: null
          monthly: null

        # alert  = notify only
        # block  = refuse new model calls until /gateway unblock <scope>
        # degrade = re-dispatch to the cheaper model in `degradation`
        overLimit: block

        # Only used by overLimit: degrade. Same provider, cheaper model.
        degradation:
          deepseek-v4-pro: deepseek-v4-flash

        # Start degrading at the warn ratio instead of only at the hard cap.
        degradeAt: warn

        warnRatio: 0.8

        # Display currency. Accounting stays USD.
        currency:
          code: CNY
          rate: 7.2
          decimals: 3

        pricing:
          # USD per 1M tokens. Entries merge over the built-in snapshot, so a
          # partial override keeps the published cache rates; only models with
          # no built-in entry fall back to the override's input rate for cache.
          # Example: { "deepseek-v4-pro": { input: 1.25, output: 3.75 } }
          prices: {}
          # The two Beijing working-hour windows are peak; everything outside
          # (including weekends/holidays) is off-peak and half price.
          peak:
            enabled: true
            timeZone: Asia/Shanghai
            offPeakMultiplier: 0.5

        gateway:
          # Control API at /token-gateway/v1/* (GET reads + POST unblock), plus a
          # fixed /_dsh-token-gateway/config bootstrap for the in-composer panel.
          http: true
          basePath: /token-gateway
          # Set a bearer token before exposing the web host beyond loopback.
          # The panel asks for this token once and keeps it in the browser.
          token: ''

        persistence:
          enabled: true
          file: $DSH_HOME/token-gateway/ledger.json
          flushMs: 500
